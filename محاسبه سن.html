<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاسبه سن</title>
   
</head>
<body>
    <h1>محاسبه سن براساس تاریخ شمسی</h1>
   <form action="" id="birthdate-form">
    <label for="year">سال:</label>
    <select name="year" id="year"></select>

    <label for="month">ماه:</label>
    <select name="month" id="month"></select>

    <label for="day">روز:</label>
    <select name="day" id="day"></select>

    <button type="submit">محاسبه سن</button>
   </form> 
   <p id="result"></p>

   <script src="https://cdn.jsdelivr.net/npm/jalaali-js/dist/jalaali.min.js"></script>
   <script>
    const yearSelect = document.getElementById("year");
    const monthSelect = document.getElementById("month");
    const daySelect = document.getElementById("day");

    const currentYear = new Date().getFullYear();
    const startYear = currentYear-50;
    for(let i =startYear; i <= currentYear; i++) {
        const option = document.createElement("option");
        option.value = i - 621;
        option.textContent = i - 621;
        yearSelect.appendChild(option)
    }

    const months =["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","ابان","اذر","دی","بهمن","اسفند"];
    months.forEach((month, index)=>
 {
        const option = document.createElement("option");
        option.value = index + 1;
        option.textContent = month;
        monthSelect.appendChild(option)
    });

    for(let i =1; i <= 31; i++) {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = i;
        daySelect.appendChild(option)
    }

    document.getElementById("birthdate-form").addEventListener("submit" , function (event) {
        event.preventDefault();
        const jYear = parseInt(yearSelect.value, 10);
        const jmonth = parseInt(monthSelect.value, 10);
        const jday = parseInt(daySelect.value, 10);

try{
    const gregorianDate = jalaali .toGregorian(jYear, jmonth, jday
    );
    const birthDate = new Date(gregorianDate.gy, gregorianDate.gm-1, gregorianDate.gd);
    const today = new Date();

    let age = today.getFullYear() -birthDate.getFullYear();
    const isBeforeBirthday =
      today.getMonth() < birthDate.getMonth() ||
     (today.getMonth() === birthDate.getMonth() && today.getDate() <
      birthDate.getDate());
if (isBeforeBirthday){
    age--;
}

document.getElementById("result").textContent =`سن شما: ${age} سال`;
}
catch(error) {
document.getElementById("result").textContent = "لطفا اطلاعات وارد شده را بررسی نمایید.";
}

    });
   </script>
</body>
</html>
